name: security-audit

# Weekly dependency audit (2026-11-07, the owner: security scanning). Scheduled and by hand
# only, never on pull requests, so it cannot block a merge: a finding turns this run red and
# lists itself in the run summary; the fix goes through a normal pull request.
on:
  schedule:
    - cron: "17 1 * * 1"      # Monday 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (runtime and build dependencies)
        run: |
          set -o pipefail
          npm audit --audit-level=low 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          { echo '### npm audit'; echo '```'; tail -n 80 "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
